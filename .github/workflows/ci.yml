name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: mypy
        run: uv run mypy custom_components/remote_logger

  # Oldest supported Home Assistant (the hacs.json / pyproject floor) and the locked newest
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.14"
            ha-version: "2026.5"
            ha-override: "2026.5.*"
          - python-version: "3.14"
            ha-version: "2026.10"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      # As supernotify: --no-config keeps [tool.uv] settings in pyproject.toml out of this resolve.
      # The test harness has to move with homeassistant, as it is built against one HA release
      - name: Pin Home Assistant ${{ matrix.ha-version }}
        if: matrix.ha-override
        run: |
          uv pip install --no-config "homeassistant==${{ matrix.ha-override }}" pytest-homeassistant-custom-component
          uv run --no-sync python -c "import homeassistant.const as c; v = c.__version__; print('Home Assistant', v); assert v.startswith('${{ matrix.ha-version }}.'), v"

      # --no-sync: a plain uv run would re-sync to the lock and undo the pin above
      - name: Test with pytest
        run: uv run --no-sync pytest

  # The one check branch protection requires, so the lint/test matrix can change without
  # editing the required status checks.
  ci-ok:
    if: always()
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do [[ $r == success ]] || exit 1; done
