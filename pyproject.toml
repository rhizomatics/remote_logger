[project]
name = "remote_logger"
readme = "README.md"
description = "Log Home Assistant events to a Syslog or OTEL collector."
dynamic = ["version"]
requires-python = ">=3.13.2"

dependencies = [
    "homeassistant>=2026.9.0; python_full_version >= '3.14.2'",
    "homeassistant>=2025.10.4,<2026.3.0; python_full_version < '3.14.2'",
]

[dependency-groups]
dev=[
    "homeassistant-stubs",
    "pytest==9.0.3; python_full_version >= '3.14.2'",
    "pytest==9.0.0; python_full_version < '3.14.2'",
    "pytest-cov",
    "pytest-homeassistant-custom-component",
    "pytest-unordered",
    "pytest-mock",
    "pytest-xdist",
    "pytest-icdiff",
    "pre-commit",
    "ruff",
    "mypy",
    "genbadge[all]"
]
docs=[
    "mkdocs-minify-plugin",
    "pymdown-extensions",
    "mkdocs-material[imaging]",
    "mkdocs-autorefs",
    "mkdocs-coverage",
    "mkdocs-pagetree-plugin",
    "properdocs",
    "pngquant",
    "mkdocstrings",
    "mkdocstrings-python",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-meta-descriptions-plugin",
    "mkdocs-minify-html-plugin",
    "mkdocs-htmlproofer-plugin",
    "mkdocs-minify-plugin",
    "mkdocs-material-extensions"
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B105"]

[tool.poetry]
package-mode = false
packages = [{ include = "custom_components.remote_logger" }]

[tool.setuptools.packages.find]
where = [
    "custom_components",
] # list of folders that contain the packages (["."] by default)
include = [
    "remote_logger*",
] # package names should match these glob patterns (["*"] by default)
exclude = [
    "remote_logger.tests*",
] # exclude packages matching these glob patterns (empty by default)
namespaces = true # to disable scanning PEP 420 namespaces (true by default)


[tool.ruff]
line-length = 128
indent-width = 4
target-version = "py314"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "htmlcov",
    ".mypy_cache",
    ".pytest_cache",
    ".github",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
preview = true
ignore = [
    "SIM117", # multiple with statements
]
unfixable = ["B"]


[tool.ruff.format]
preview = true

[tool.uv]
exclude-newer = "5 days"
add-bounds = "major"
# Skip the 3.14.0-3.14.1 gap: HA 2026.3+ requires >=3.14.2, so those patch
# versions are unusable regardless.
environments = [
    "python_full_version < '3.14'",
    "python_full_version >= '3.14.2'",
]
override-dependencies = [
    "homeassistant>=2025.10.4,<2026.3.0; python_full_version < '3.14.2'",
    "homeassistant>=2026.9.0; python_full_version >= '3.14.2'",
    "homeassistant-stubs<2026.3.0; python_full_version < '3.14.2'",
    "homeassistant-stubs>=2026.9.0; python_full_version >= '3.14.2'",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
]
norecursedirs = [
    ".git",
    "templates",
]

addopts = [
    "--timeout=30",
    "--cov-report=xml:cov.xml",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov=custom_components/remote_logger",
    "--cov-fail-under=90"
]
