[project]
name = "remote_logger"
readme = "README.md"
description = "Log Home Assistant events to a Syslog or OTEL collector."
dynamic = ["version"]
requires-python = ">=3.14.2"

dependencies = [
    "homeassistant>=2026.5.0",
]

[dependency-groups]
dev=[
    "homeassistant-stubs",
    "pytest==9.0.3",
    "pytest-cov",
    "pytest-homeassistant-custom-component",
    "pytest-unordered",
    "pytest-mock",
    "pytest-xdist",
    "pytest-icdiff",
    "ruff",
    "mypy",
    "genbadge[all]",
    "codespell>=2.4.3",
]
docs=[
    "mkdocs-minify-plugin",
    "pymdown-extensions",
    "mkdocs-materialx[imaging]",
    "mkdocs-autorefs",
    "mkdocs-coverage",
    "mkdocs-pagetree-plugin",
    "properdocs",
    "pngquant",
    "mkdocstrings",
    "mkdocstrings-python",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-meta-descriptions-plugin",
    "mkdocs-minify-html-plugin",
    "mkdocs-htmlproofer-plugin",
    "mkdocs-minify-plugin",
    "mkdocs-material-extensions",
    "mkdocs-llmstxt>=0.5.1",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B105"]

[tool.poetry]
package-mode = false
packages = [{ include = "custom_components.remote_logger" }]

[tool.setuptools.packages.find]
where = [
    "custom_components",
] # list of folders that contain the packages (["."] by default)
include = [
    "remote_logger*",
] # package names should match these glob patterns (["*"] by default)
exclude = [
    "remote_logger.tests*",
] # exclude packages matching these glob patterns (empty by default)
namespaces = true # to disable scanning PEP 420 namespaces (true by default)


[tool.ruff]
line-length = 128
indent-width = 4
target-version = "py314"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "htmlcov",
    ".mypy_cache",
    ".pytest_cache",
    ".github",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
preview = true
ignore = [
    "SIM117", # multiple with statements
]
unfixable = ["B"]


[tool.ruff.format]
preview = true

[tool.mypy]
# Home Assistant Integration Quality Scale (Platinum): strict-typing
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# docs_hooks type against properdocs, which is in the docs group but not the pre-commit mypy environment
module = ["properdocs.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["arg-type", "call-overload", "index", "operator"]

[tool.ty.src]
include = ["custom_components/remote_logger","tests"]

[tool.ty.rules]
unused-type-ignore-comment="ignore"
# Home Assistant entities override is_on, extra_state_attributes etc. with a plain property
invalid-property-type-override="ignore"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"

[tool.codespell]
ignore-words-list = "hass,alot,astroid,NotIn,datas,dof,dur,farenheit,hist,iff,ines,ist,lightsensor,mut,nd,pres,referer,ser,serie,te,technik,ue,uint,visability,wan,wanna,withing"
skip = "./.*,*.csv,*.json,uv.lock,./htmlcov,./junit,./site,cov.xml,./README.??.md,./README.??-*.md,./docs/??/index.md,./docs/??-*/index.md"
quiet-level = 2

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { uv = "2 days" }
add-bounds = "major"
# Home Assistant pins uv exactly, and under `uv run` the venv's uv comes first on PATH,
# shadowing the mise-managed one. Floor at the latest uv security fix (GHSA-hq85-5cpj-mr62).
override-dependencies = ["uv>=0.13.4"]
# Skip the 3.14.0-3.14.1 gap: HA 2026.3+ requires >=3.14.2, so those patch
# versions are unusable regardless.
environments = [
    "python_full_version >= '3.14.2'",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
]
norecursedirs = [
    ".git",
    "templates",
]

addopts = [
    # pytest-homeassistant installs respx, whose pytest plugin it asks to be switched off
    "-p", "no:respx",
    "--timeout=30",
    "--cov-report=xml:cov.xml",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov=custom_components/remote_logger",
    "--cov-fail-under=90"
]

# only one of the two test helper packages is installed at a time
[[tool.ty.overrides]]
include = ["tests/ha_testing.py"]

[tool.ty.overrides.rules]
import-not-found = "ignore"
