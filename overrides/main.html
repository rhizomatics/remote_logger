{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page and page.meta.markdown_url %}
    <link rel="alternate" type="text/markdown" href="{{ page.meta.markdown_url }}">
  {% endif %}
  {# Page views: GoatCounter, cookieless, so no consent banner (hq policies/project_standards.md) #}
  <script data-goatcounter="https://remote-logger.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
{% endblock %}
